
services:
  db:
    image: postgres:17
    container_name: careflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: careflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: careflow_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careflow -d careflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
